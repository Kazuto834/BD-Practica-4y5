services:
  postgres:
    image: postgres:16-alpine
    container_name: piston_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: almacen_piston
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d almacen_piston"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: piston_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://admin:admin123@postgres:5432/almacen_piston
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: piston_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../app-almacen:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  postgres_data: