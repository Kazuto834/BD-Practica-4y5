services:
  postgres:
    image: postgres:16-alpine
    container_name: piston_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-almacen_piston}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-almacen_piston}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: piston_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@postgres:5432/${POSTGRES_DB:-almacen_piston}
      EMP_EMAIL: ${EMP_EMAIL:-empleado@local.test}
      EMP_PASSWORD: ${EMP_PASSWORD:-emp1234}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@local.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-local1234}
      AUTH_SECRET: ${AUTH_SECRET:-clave_local_por_defecto}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: piston_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../app-almacen:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  postgres_data: